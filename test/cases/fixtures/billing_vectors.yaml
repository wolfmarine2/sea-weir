# 计价黄金用例。与 doc/architecture/TEST-VECTORS.md §1 同源。
# 期望值取自 new-api service/text_quota_test.go 的 Go 单测断言。
#
# 用途:除了 Rust 侧的 rstest,也供实现者手工核验与后续补充新向量。

meta:
  source: "new-api service/text_quota_test.go"
  formula: "doc/architecture/CONTRACTS.md §6"
  rounding: "half away from zero(rust_decimal 需显式 MidpointAwayFromZero)"

vectors:
  - id: TV-BILL-001
    name: "OpenAI 语义 + 缓存读"
    usage_semantic: openai
    usage:
      prompt_tokens: 2604
      completion_tokens: 383
      cached_tokens: 2432
    price:
      model_ratio: 1
      group_ratio: 1
      completion_ratio: 1
      cache_ratio: 0.1
    steps:
      - "base     = 2604 - 2432 = 172"
      - "cache_q  = 2432 * 0.1  = 243.2"
      - "compl_q  = 383 * 1     = 383"
      - "quota    = (172 + 243.2 + 383) * 1 = 798.2 -> 798"
    expected_quota: 798

  - id: TV-BILL-002
    name: "Claude 语义 + 缓存写入分档"
    usage_semantic: anthropic
    usage:
      prompt_tokens: 1000
      completion_tokens: 200
      cached_tokens: 100
      cache_creation_tokens: 50
      claude_cache_creation_5m_tokens: 10
      claude_cache_creation_1h_tokens: 20
    price:
      model_ratio: 1
      group_ratio: 1
      completion_ratio: 2
      cache_ratio: 0.1
      cache_creation_ratio: 1.25
      cache_creation_5m_ratio: 1.25
      cache_creation_1h_ratio: 2
    steps:
      - "base     = 1000          # Claude 语义不扣减"
      - "cache_q  = 100 * 0.1 = 10"
      - "create_q = (50-10-20)*1.25 + 10*1.25 + 20*2 = 25 + 12.5 + 40 = 77.5"
      - "compl_q  = 200 * 2 = 400"
      - "quota    = (1000 + 10 + 77.5 + 400) * 1 = 1487.5 -> 1488"
    expected_quota: 1488
    extra_assert: "入口为 OpenAI 但最终上游为 Claude 时结果必须相同"

  - id: TV-BILL-003
    name: "Claude 语义 + 仅缓存写入"
    usage_semantic: anthropic
    usage:
      prompt_tokens: 100
      completion_tokens: 0
      cache_creation_tokens: 10
      claude_cache_creation_5m_tokens: 2
      claude_cache_creation_1h_tokens: 3
    price:
      model_ratio: 1
      group_ratio: 1
      completion_ratio: 1
      cache_ratio: 0
      cache_creation_ratio: 1
      cache_creation_5m_ratio: 2
      cache_creation_1h_ratio: 3
    steps:
      - "create_q = (10-2-3)*1 + 2*2 + 3*3 = 5 + 4 + 9 = 18"
      - "quota    = (100 + 18) * 1 = 118"
    expected_quota: 118

  - id: TV-BILL-004
    name: "遗留 Claude 派生的 OpenAI usage(按 Claude 语义处理)"
    usage_semantic: "openai 上报但含 claude 分档字段 -> 按 anthropic 处理"
    usage:
      prompt_tokens: 62
      completion_tokens: 95
      cached_tokens: 3544
      claude_cache_creation_5m_tokens: 586
    price:
      model_ratio: 1
      group_ratio: 1
      completion_ratio: 5
      cache_ratio: 0.1
      cache_creation_5m_ratio: 1.25
    steps:
      - "quota = 62 + 3544*0.1 + 586*1.25 + 95*5 = 1623.9 -> 1624"
    expected_quota: 1624
    note: "new-api 该测试注释写 1624.9 系笔误,断言值 1624 与实算 1623.9 一致"

  - id: TV-BILL-005
    name: "取整判别:half-away vs banker's"
    usage:
      prompt_tokens: 1597
      completion_tokens: 0
    price:
      model_ratio: 0.5
      group_ratio: 1
      completion_ratio: 1
    steps:
      - "quota = 1597 * 0.5 = 798.5"
      - "half away from zero -> 799"
      - "banker's rounding   -> 798(错误)"
    expected_quota: 799

  - id: TV-BILL-006
    name: "按次计费"
    mode: per_call
    cases:
      - { model_price: 0.02, group_ratio: 1,   expected_quota: 10000 }
      - { model_price: 0.02, group_ratio: 0.5, expected_quota: 5000 }
      - { model_price: 1,    group_ratio: 1,   expected_quota: 500000 }

  - id: TV-BILL-007
    name: "边界与下限"
    cases:
      - { desc: "total_tokens 为 0", usage: {prompt_tokens: 0, completion_tokens: 0}, price: {model_ratio: 1}, expected_quota: 0 }
      - { desc: "倍率非零下限为 1",  usage: {prompt_tokens: 1}, price: {model_ratio: 0.0000001}, expected_quota: 1 }
      - { desc: "倍率为 0 保持免费", usage: {prompt_tokens: 1000, completion_tokens: 1000}, price: {model_ratio: 0}, expected_quota: 0 }
