[package]
name = "sea-weir-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "二进制入口:axum :8080,四个路由面 + 中间件链 + 16 管理域 handlers + 中继入口。"

# lib + bin 双目标:lib 供测试 crate 导入 router / middleware 做自省与单测,
# bin 是实际入口。见 test/cases/11-route-completeness.md。
[lib]
name = "sea_weir_server"
path = "src/lib.rs"

[[bin]]
name = "sea-weir-server"
path = "src/main.rs"

