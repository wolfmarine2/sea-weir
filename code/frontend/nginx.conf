# sea-weir 前端容器 nginx 配置(K8s 部署形态)。
# 与 doc/system-design.md §9.1、architecture/deployment-architecture.puml 一致。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA fallback:前端用 BrowserRouter,深链接需回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- 管理面 ---
    location /api/ {
        proxy_pass http://sea-weir-svc:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 中继面 + 兼容面 ---
    # 关键:SSE 与 WebSocket 必须关闭缓冲、放宽超时,否则流式响应会被 nginx 攒着不发。
    location ~ ^/(v1|v1beta|mj|suno|kling|jimeng|pg|dashboard)/ {
        proxy_pass http://sea-weir-svc:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket(/v1/realtime)升级
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE:禁用缓冲,否则客户端收不到增量 chunk
        proxy_buffering     off;
        proxy_cache         off;
        chunked_transfer_encoding on;

        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }
}
